name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The minimum in go.mod and the two supported Go releases.
        go-version: ['1.22', 'oldstable', 'stable']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Fuzz
        if: matrix.go-version == 'stable'
        run: |
          for target in FuzzMetrics FuzzASCIIOnly FuzzPhonetic; do
            go test -run '^$' -fuzz "^${target}\$" -fuzztime 15s .
          done
      - name: Coverage
        if: matrix.go-version == 'stable'
        run: go test -coverprofile=coverage.out .
      - name: Upload coverage
        if: matrix.go-version == 'stable'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Check formatting
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            gofmt -s -d $unformatted
            exit 1
          fi
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15

  commits:
    # Same check as scripts/hooks/commit-msg, for clones without the hook.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check commit messages
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$BASE..$HEAD"
            printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title"
            scripts/hooks/commit-msg "$RUNNER_TEMP/title"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            range="$BEFORE..$GITHUB_SHA"
          else
            exit 0
          fi
          status=0
          for sha in $(git rev-list --no-merges "$range"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            scripts/hooks/commit-msg "$RUNNER_TEMP/msg" || status=1
          done
          exit $status
